# Deploys each pull request's website as its own Worker,
# mochinori-website-pr-<number>, at
# https://mochinori-website-pr-<number>.<subdomain>.workers.dev, comments
# the URL on the pull request, and deletes the Worker when the pull request
# is closed. Production is never touched.
#
# A separate Worker (rather than a preview version of mochinori-website)
# because Cloudflare gives no preview URL to versions of a Worker that
# defines Durable Objects. It also means each preview has its own Durable
# Objects and applies its own migrations. The R2 bucket is shared with
# production, and previews have no cron triggers (production's cron expires
# demo uploads for both).
#
# Needs the same CLOUDFLARE_API_TOKEN secret (and CLOUDFLARE_ACCOUNT_ID) as
# the Deploy workflow. Pull requests from forks get no secrets, so they are
# skipped.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: true
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PREVIEW_WORKER: mochinori-website-pr-${{ github.event.pull_request.number }}

jobs:
  preview:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mochinori-website-worker
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: 24.x
      - run: pnpm run build
      # A pull request that adds an R2 bucket would otherwise fail to deploy
      # until a deploy from main creates it.
      - name: Create missing R2 buckets
        run: |
          for bucket in $(node -e 'for (const b of require("./dist/ssr/wrangler.json").r2_buckets ?? []) console.log(b.bucket_name)'); do
            pnpm exec wrangler r2 bucket info "$bucket" > /dev/null 2>&1 ||
              pnpm exec wrangler r2 bucket create "$bucket"
          done
      - name: Deploy the preview Worker
        run: |
          set -o pipefail
          # The built config, renamed, on workers.dev only (not production's
          # custom domain), without cron triggers, in the account the secrets
          # name. It stays next to the original so its relative paths work.
          node -e '
            const config = require("./dist/ssr/wrangler.json");
            config.name = process.env.PREVIEW_WORKER;
            config.workers_dev = true;
            config.triggers = {crons: []};
            delete config.routes;
            delete config.route;
            delete config.account_id;
            require("fs").writeFileSync("dist/ssr/wrangler.preview.json", JSON.stringify(config));
          '
          pnpm exec wrangler deploy -c dist/ssr/wrangler.preview.json \
            --message "PR #$PR_NUMBER at ${HEAD_SHA:0:7}" | tee deploy.log
          url=$(grep -oE "https://$PREVIEW_WORKER\.[a-z0-9-]+\.workers\.dev" deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::wrangler deploy printed no workers.dev URL"
            exit 1
          fi
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body \
            "Website preview for ${HEAD_SHA:0:7}: $PREVIEW_URL"

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mochinori-website-worker
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: 24.x
      - name: Delete the preview Worker
        run: |
          if pnpm exec wrangler deployments list --name "$PREVIEW_WORKER" > /dev/null 2>&1; then
            pnpm exec wrangler delete "$PREVIEW_WORKER" --force
          else
            echo "No preview Worker $PREVIEW_WORKER to delete"
          fi
