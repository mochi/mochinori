# Deploys the Cloudflare app (cloudflare/alchemy.run.ts). Runs only when
# started by hand from the Actions tab, and needs these repository secrets:
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and ALCHEMY_STATE_TOKEN.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'alchemy stage to deploy'
        required: true
        default: 'prod'
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CI: true
      ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STAGE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: 24.x
      - run: pnpm run cf:deploy --stage "$STAGE"
