name: Changesets

# Checks that a pull request which changes a published package's code adds a
# changeset naming that package. Runs separately from the Tests workflow so
# that adding or removing the `skip-changeset` label only re-runs this quick
# check. The format of changeset files is checked by `ci-check`.
# See .changeset/README.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # `error` fails the check when a changeset is missing; `warn` only reports
  # it (in the job summary and as an annotation with an "add changeset" link).
  CHANGESET_COVERAGE: error

jobs:
  changesets:
    # Release pull requests (the `release/v*` branch the Release workflow
    # pushes to this repository) consume the changesets. A fork's branch
    # name does not exempt it.
    if: ${{ !(startsWith(github.head_ref, 'release/v') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      # Run the checker from the base revision, so a pull request cannot
      # change the rules it is checked by. A base without the checker (the
      # pull request that adds it) falls back to the head's copy. The
      # checker uses only Node built-ins, so no install is needed.
      - name: Check changeset coverage
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          checker="$RUNNER_TEMP/base/scripts/changesets/check.mjs"
          if [ ! -f "$checker" ]; then
            checker=scripts/changesets/check.mjs
          fi
          node "$checker" --root "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head HEAD
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SKIP_CHANGESET: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changeset') }}
          # Used to build a prefilled "add changeset" link. Passed through the
          # environment, never interpolated into the script.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
