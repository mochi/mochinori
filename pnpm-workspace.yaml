packages:
  - 'packages/*'

engineStrict: true

# Wait a week before adopting any newly published version, except for
# Lexical and Void, which we track closely.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@lexical/*'
  - 'lexical'
  - '@void/*'
  - 'void'
  # Cloudflare's tooling, which void pins to its newest releases
  - '@cloudflare/*'
  - 'cf'
  - 'miniflare'
  - 'workerd'
  - 'wrangler'
  # Exact versions void 1.6.2 pins; later releases wait the full week
  - 'hono@4.13.16'

# Lexical is a singleton within an app: every workspace package uses the
# same exact version (devDependencies), and the published libraries declare
# a compatible range in peerDependencies. Bump both together.
catalog:
  lexical: '0.53.0'
  '@lexical/clipboard': '0.53.0'
  '@lexical/eslint-plugin': '0.53.0'
  '@lexical/extension': '0.53.0'
  '@lexical/fast-check': '0.53.0'
  '@lexical/history': '0.53.0'
  '@lexical/html': '0.53.0'
  '@lexical/mdast': '0.53.0'
  '@lexical/react': '0.53.0'
  '@lexical/rich-text': '0.53.0'
  '@lexical/selection': '0.53.0'
  '@lexical/utils': '0.53.0'
  react: '^19.3.1'
  react-dom: '^19.3.1'

peerDependencyRules:
  allowedVersions:
    eslint: '10'

# Dependency build scripts stay disabled unless a package needs one.
allowBuilds:
  '@swc/core': false
  better-sqlite3: false
  core-js: false
  esbuild: false
  sharp: false
  unrs-resolver: false
  workerd: false
