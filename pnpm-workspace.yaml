packages:
  - 'packages/*'
  - 'cloudflare'

engineStrict: true

# Wait a week before adopting any newly published version, except for
# Lexical itself, which we track closely.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@lexical/*'
  - 'lexical'

# Lexical is a singleton within an app: every workspace package uses the
# same exact version (devDependencies), and the published libraries declare
# a compatible range in peerDependencies. Bump both together.
catalog:
  lexical: '0.52.0'
  '@lexical/eslint-plugin': '0.52.0'
  '@lexical/extension': '0.52.0'
  '@lexical/history': '0.52.0'
  '@lexical/html': '0.52.0'
  '@lexical/react': '0.52.0'
  '@lexical/rich-text': '0.52.0'
  '@lexical/utils': '0.52.0'
  react: '^19.2.5'
  react-dom: '^19.2.5'

peerDependencyRules:
  allowedVersions:
    eslint: '10'

# Dependency build scripts stay disabled unless a package needs one.
allowBuilds:
  '@swc/core': false
  core-js: false
  esbuild: false
  sharp: false
  unrs-resolver: false
  workerd: false
